modules:
  webtrigger:
    - key: mcp-endpoint
      function: mcp
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
  function:
    - key: mcp
      handler: index.mcpHandler
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-configuration
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c596230b-2e1a-4186-90bc-2acaffc22fe7
  storage:
    entities:
      - name: spike-event
        attributes:
          agentId:
            type: string
          ts:
            type: integer
        indexes:
          - name: by-agent-ts
            range:
              - ts
            partition:
              - agentId
